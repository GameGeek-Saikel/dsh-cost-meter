name: publish.yml

# Stages the tagged commit on npm under the dist-tag its DSH peer ranges pick.
#
# Trusted publishing for this repository grants `stage` and `dist-tag`, not
# direct publish: a plain PUT is refused with "OIDC permission denied for this
# action", and npm is retiring 2FA-bypass direct publishing anyway. Staging
# uploads and provenances the version here; it goes live when the maintainer
# runs `npm stage approve <stage-id>`, and that approval carries the dist-tag
# chosen below.
#
# The dist-tag is not derived from the version string alone: DSH ships two
# release lines at once (@deepseek-ai/dsh names the current one under `latest`
# and the upcoming one under `next`), and a plugin version only runs on the
# line its @deepseek-ai/dsh* peer ranges accept. scripts/dist-tag.mjs reads
# those ranges, reads the DSH lines from the registry, and picks `latest`,
# `next`, or `alpha` — the same judgement the runtime gate makes before it
# loads a bundle. The community market installs the bare package name, i.e.
# whatever `latest` names, so this choice decides whether a visitor's runtime
# accepts what the market just installed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check if version is already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@gamegeek-saikel/dsh-cost-meter@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already published; skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the release on npm
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG=$(node scripts/dist-tag.mjs resolve)
          echo "staging with dist-tag $TAG"
          npm stage publish --provenance --access public --tag "$TAG"

      - name: Report the approval step
        if: steps.check.outputs.skip != 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "::notice title=Staged on npm::$PKG_VERSION is staged with its dist-tag. Approve it with 'npm stage approve <stage-id>' ('npm stage list' prints the id), then run dist-tags.yml to repair any tag the release left behind."

      # No reconcile here: the version is not on the registry until a maintainer
      # approves the stage, and the `--tag` above already fixes the tag it will
      # land under. Repairing tags that an earlier release left wrong is what
      # .github/workflows/dist-tags.yml is for; run it after approving.